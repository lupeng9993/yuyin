pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // 本地 AAR：sherpa-onnx-2.0.1.aar 由 CI 或 scripts/fetch-sherpa-onnx.* 放入 app/libs。
        // 仓库不提交该 AAR（约 49 MB），避免污染 git 历史。
        flatDir {
            dirs "${rootDir}/app/libs"
        }
    }
}

rootProject.name = "VoiceAssistant"
include ':app'
